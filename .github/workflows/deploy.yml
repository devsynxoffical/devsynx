name: Build and deploy to hosting (FTPS)

# Builds the static Next.js export and uploads only changed files to the
# hosting account. Credentials come from repository secrets, never from code:
#   Settings > Secrets and variables > Actions > New repository secret
#     FTP_SERVER    e.g. ftp.devsynx.com
#     FTP_USERNAME  the FTP account user
#     FTP_PASSWORD  the FTP account password
# Optional repository variable (Settings > Secrets and variables > Actions > Variables):
#     FTP_SERVER_DIR  folder on the server that holds the site, default "./"
#                     (use "public_html/" if the FTP account opens one level above it)

on:
  push:
    branches: [main, claude/friendly-mccarthy-n4j32s]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Check build output
        run: |
          test -f frontend/out/index.html
          test -f frontend/out/sitemap.xml
          echo "Pages built: $(find frontend/out -name index.html | wc -l)"

      - name: Skip deploy (FTP secrets not set yet)
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER secret is not set, so the site was built but not uploaded."

      - name: Upload changed files over FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: frontend/out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
