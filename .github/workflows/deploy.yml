name: Build and deploy to hosting (FTPS)

# Builds the static Next.js export and uploads only changed files to the
# hosting account. Credentials come from repository secrets, never from code:
#   Settings > Secrets and variables > Actions > New repository secret
#     FTP_SERVER    e.g. ftp.devsynx.com
#     FTP_USERNAME  the FTP account user
#     FTP_PASSWORD  the FTP account password
# Optional repository variable (Settings > Secrets and variables > Actions > Variables):
#     FTP_SERVER_DIR  folder on the server that holds the site, default "./"
#                     (use "public_html/" if the FTP account opens one level above it)
# Contact form email (SMTP) secrets, used to write contact-config.php at deploy time:
#     SMTP_PASSWORD   password of the mailbox the form sends from (required to enable SMTP)
#     SMTP_USER       mailbox address, default info@devsynx.com
#     SMTP_HOST       mail server, default mail.devsynx.com
#     SMTP_PORT       SSL port, default 465

on:
  push:
    branches: [main, claude/friendly-mccarthy-n4j32s]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Check build output
        run: |
          test -f frontend/out/index.html
          test -f frontend/out/sitemap.xml
          echo "Pages built: $(find frontend/out -name index.html | wc -l)"

      - name: Write contact form mail settings (from secrets)
        if: env.SMTP_PASSWORD != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python3 - <<'PY'
          import os
          def q(s): return "'" + s.replace("\\", "\\\\").replace("'", "\\'") + "'"
          host = os.environ.get("SMTP_HOST") or "mail.devsynx.com"
          user = os.environ.get("SMTP_USER") or "info@devsynx.com"
          port = int(os.environ.get("SMTP_PORT") or "465")
          pw = os.environ["SMTP_PASSWORD"]
          with open("frontend/out/contact-config.php", "w") as f:
              f.write("<?php return ['host' => %s, 'port' => %d, 'user' => %s, 'pass' => %s];\n" % (q(host), port, q(user), q(pw)))
          print("contact-config.php written for", user, "via", host)
          PY

      - name: Skip deploy (FTP secrets not set yet)
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER secret is not set, so the site was built but not uploaded."

      - name: Upload changed files over FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: frontend/out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
