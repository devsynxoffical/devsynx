name: Automated Search Engine Indexing

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site export
        working-directory: frontend
        run: npm run build

      - name: Run automated search indexing
        working-directory: frontend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
        run: npm run index
